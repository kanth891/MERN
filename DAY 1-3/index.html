<!DOCTYPE html>
<html>
    <head>
        <title>price cards
        </title>
        <style>
            *{
                box-sizing: border-box;
            }
            body{
                margin:0;
                background :#c2bfc2;
                padding:50px;
            }
            h1{
                text-align:center;
                margin-bottom:35px;
            }
            .pricing{
                display:flex;
                gap:25px;
                justify-content: center;
            }
            .plan{
                background:rgb(237, 248, 133);
                width:300px;
                padding:35px;
                border-radius: 18px;
                box-shadow: 0 8px 20px rgba(252, 2, 2, 0.1);
                text-align: center;

            }
            .plan.featured{
                transform:scale(1.05);
                border:3px solid #2563eb;
            }
            .plan h2{
                color:#2563eb;
            }
            .price{
                font-size:36px;
                font-weight:bold;
                margin:20px 0;
            }
            .plan ul{
                list-style:none;
                padding:0;
                line-height:2;
            }
            button{
                margin-top:20px;
                padding:12px 28px;
                background:#2563eb;
                color:white;
                border:none;
                border-radius:8px;
            }
            @media(max-width:800px){
                .pricing{
                    flex-direction:column;
                    align-items:center;
                }
                .plan.featured{
                    transform:none;
                }
            }
        </style>
    </head>
    <body>
        <h1>choose your plan</h1>
        <div class="pricing">
            <div class="plan">
                <h2>basic</h2>
                <div class="price">999</div>
                <ul>
                    <li>Html Basics</li>
                    <li>CSS Basics</li>
                    <li>Email support</li>
                </ul>
                <button>choose</button>
            </div>
            <div class="plan featured">
                <h2>pro</h2>
                <div class="price">1999</div>
                <ul>
                    <li>Html+css</li>
                    <li>responsive design</li>
                    <li>Live Projects</li>
                </ul>
                <button>choose</button>
            </div>
            <div class="plan">
                <h2>advanced</h2>
                <div class="price">2999</div>
                <ul>
                    <li>CSS grid</li>
                    <li>Flexbox</li>
                    <li>portfolio</li>
                </ul>
                <button>choose</button>
            </div>
        </div>
    </body>

</html>
