<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Page</title>
    <style>
        .total{
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .card{
            /* border: 1px solid black; */
            justify-content: center;
            display: flex;
            flex-direction: row;
            margin: 0px 330px;
            margin-top: 50px;
        }
        .bg_cont{
            /* border: 1px solid black; */
            height:500px;
            border-top-left-radius: 40px;
            border-bottom-left-radius: 40px;
            padding-top: 60px;
            padding-left: 40px;
            padding-right: 150px;
            /* border-right: 1px solid black; */
            color: aliceblue;
            background-image: url('download.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .login{
            border: 1px solid black;
            border-top-right-radius: 40px;
            border-bottom-right-radius: 40px;
            padding-top: 60px;
            padding-left: 40px;
            padding-right: 150px;
            /* height:100px; */
        }
    </style>
</head>
<body class="total">
    <div class="card">
        <div class = "bg_cont">
            <h1>Welcome Back</h1>
            <p>Glad to see you again! Please login to <br>continue your Journey</p>
        </div>
        <div class="login">
            <h1>Welcome Back</h1>
            <p>Login to your account to continue</p>
            <form onsubmit="return validate()">
            Email <br>
            <input type="text" id="username" placeholder="Enter your email"> <br/> <br/>
            Password <br>
            <input type="password" id="pass" placeholder="Enter your password"><br><br>
            <input type="submit">
            </form>
        </div>
    </div>
</body>
</html>
